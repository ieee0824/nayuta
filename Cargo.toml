[package]
name = "nayuta"
version = "0.2.1"
edition = "2024"
license = "MIT"
description = "A lightweight static analyzer for finding O(N) and higher complexity candidates in Rust"

[dependencies]
syn = { version = "2", features = ["full", "visit"] }
proc-macro2 = { version = "1", features = ["span-locations"] }
